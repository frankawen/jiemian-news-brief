name: 词语储备每日爬取

on:
  # 定时已停用（2026-08-26）：工作台不依赖本仓库，停止每日自动爬取；保留手动触发与仓库
  # schedule:
  #   - cron: "15 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl-words:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 爬取头条暖心祝福扩展词语库
        run: python words.py

      - name: 提交 words.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/frankawen/jiemian-news-brief.git"
          git add words.json
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 每日爬取更新词语储备 [skip ci]"
            git push
          fi
