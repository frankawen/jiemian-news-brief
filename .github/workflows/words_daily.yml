name: 词语储备每日爬取

on:
  schedule:
    # 每天北京时间 04:15 爬头条「暖心祝福」扩展词语储备（对应 UTC 前一日 20:15）
    - cron: "15 20 * * *"
  workflow_dispatch: {}   # 允许手动触发

permissions:
  contents: write

jobs:
  crawl-words:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 爬取头条「暖心祝福」扩展词语库
        run: python words.py

      - name: 提交 words.json（爬取失败时不覆盖旧数据）
        run: |
          # 若本次爬取产生空文件（0 条）则丢弃，保留上一次有效词库
          if [ -f words.json ]; then
            python - <<'EOF'
import json
try:
    d = json.load(open("words.json", encoding="utf-8"))
    if d.get("words"):
        print("words.json 有效：%d 条" % len(d["words"]))
    else:
        import sys
        print("words.json 为空，放弃本次提交", file=sys.stderr)
        sys.exit(0)
except Exception as e:
    print("words.json 解析失败，放弃提交:", e)
EOF
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/frankawen/jiemian-news-brief.git"
          git add words.json
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 每日爬取更新词语储备 [skip ci]"
            git push
          fi
