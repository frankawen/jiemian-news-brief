name: 每日一读 + 词语库

on:
  schedule:
    # 每 3 小时跑一次，比 daily.yml 错开 1 小时（北京 1/4/7/10/13/16/19/22 点）
    # 对应 UTC 的 17,20,23,2,5,8,11,14 点
    # 错峰原因：与「界面新闻每日快报」共用整点 cron 时，GitHub Actions 高峰期
    #           常丢轮 + 双 workflow 同时 push 互相冲突，导致 words.json 停更
    - cron: "0 17,20,23,2,5,8,11,14 * * *"
  workflow_dispatch: {}   # 允许在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # 全量历史：保证下方 pull --rebase 在并发推送后仍能找到共同祖先
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 生成 每日一读（人民日报评论 + 学习强国种子）
        run: python daily_read.py

      - name: 生成 词语库（头条搜索「暖心祝福」enrich）
        run: python words.py

      - name: 提交 JSON 产物（rebase 重试，避免与另一 workflow 的 push 冲突）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/frankawen/jiemian-news-brief.git"
          git add daily_read.json words.json xuexi_seed.json
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 更新每日一读与词语库 [skip ci]"
          # 先 rebase 到远端最新再推，失败重试最多 3 次（间隔 15s），
          # 消除与 daily.yml 并发 push 时的 non-fast-forward 冲突
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "push 成功（第 $i 次尝试）"
              exit 0
            fi
            echo "push 失败，${i}0 秒后重试…"
            sleep 15
          done
          echo "::error::推送重试 3 次仍失败，请检查 Actions 日志"
          exit 1
