name: 每日一读 + 词语库

on:
  # 定时已停用（2026-08-26）：工作台不依赖本仓库，停止每日自动爬取；保留手动触发与仓库
  # schedule:
  #   # 每天一次：北京时间 06:00
  #   - cron: "0 22 * * *"
  workflow_dispatch: {}   # 允许在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 生成 每日一读（诗经 + 名句 + 学习强国种子 + 口才 + 人民日报评论）
        run: python daily_read.py

      - name: 生成 词语库（hitokoto 公开接口 enrich）
        run: python words.py

      - name: 提交 JSON 产物
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/frankawen/jiemian-news-brief.git"
          git add daily_read.json words.json xuexi_seed.json shijing_index.json mingju_index.json
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 更新每日一读与词语库 [skip ci]"
            git push
          fi
