name: 界面新闻每日快报

on:
  # 定时爬取已停用（2026-08-26）：工作台不依赖本仓库，停止每日自动爬取；保留手动触发与仓库
  # schedule:
  #   # 每 3 小时抓取一次，北京时间 XX:16
  #   - cron: "16 16,19,22,1,4,7,10,13 * * *"
  workflow_dispatch: {}   # 允许在 Actions 页面手动触发

permissions:
  contents: write        # 需写回去重状态文件 .state/pushed_ids.json

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取并推送每日简报
        env:
          PUSH_METHOD: ${{ secrets.PUSH_METHOD }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          WECOM_KEY: ${{ secrets.WECOM_KEY }}
          MAX_ITEMS: ${{ secrets.MAX_ITEMS }}
          TODAY_ONLY: ${{ secrets.TODAY_ONLY }}
          TIMEZONE_OFFSET: ${{ secrets.TIMEZONE_OFFSET }}
        run: python news_brief.py

      - name: 保存去重状态（每次抓取后对之前推送去重）
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/frankawen/jiemian-news-brief.git"
          git add .state/pushed_ids.json news.json
          if git diff --cached --quiet; then
            echo "去重状态无变化，跳过提交"
          else
            git commit -m "chore: 更新已推送状态 [skip ci]"
            git push
          fi
